<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ride &amp; Vibe HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: asphalt sidebar pinned left with a dashed road line; light working surface; rows tinted by booking status */
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --surface-2:#F7F8FA; --fg:#1B1E29; --muted:#666C7D; --line:#E2E4EB;
  --asphalt:#171A24; --asphalt-2:#222634; --side-fg:#C9CCD6; --road:#FFC53D;
  --ink-btn:#1B1E29; --ink-btn-fg:#FFFFFF;
  --f-display:"Unbounded","Onest",system-ui,sans-serif; --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  /* booking status: tint (row) + strong (dot/text) */
  --st-new-bg:transparent; --st-new:#8A90A0;
  --st-talk-bg:#FFF3BF; --st-talk:#B88700;
  --st-deposit-bg:#DDEBFF; --st-deposit:#2A6FD6;
  --st-paid-bg:#D8F3DF; --st-paid:#1B8A42;
  --st-lost-bg:#E9EAEE; --st-lost:#7D828F;
  --st-special-bg:#ECDFFF; --st-special:#7337D6;
  --st-refund-bg:#FFDDDC; --st-refund:#D12C2C;
  /* tour colors */
  --t-west:#EE7414; --t-west-bg:#FFEBDA; --t-miami:#DE3F92; --t-miami-bg:#FFE1F0; --t-east:#2A86CF; --t-east-bg:#DFF0FC;
  --t-nyc:#12927E; --t-nyc-bg:#D8F4EE; --t-dc:#5B61D1; --t-dc-bg:#E4E5FB;
  --t-westx:#B8480C; --t-westx-bg:#FBE3D3; --t-eastx:#1F4E9E; --t-eastx-bg:#DCE6F7; --t-niagara:#8A6D00; --t-niagara-bg:#F5ECC9;
  --tg:#2AABEE;
  --shadow:0 1px 2px rgba(20,24,36,.06),0 8px 24px rgba(20,24,36,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101219; --surface:#181B25; --surface-2:#1E2230; --fg:#E6E8EF; --muted:#9A9FB0; --line:#2A2F3E;
  --asphalt:#0B0D13; --asphalt-2:#171A24; --side-fg:#B9BDC9; --road:#FFC53D; --ink-btn:#E6E8EF; --ink-btn-fg:#12141B;
  --st-new-bg:transparent; --st-new:#8A90A0; --st-talk-bg:#3A3312; --st-talk:#F2CB47; --st-deposit-bg:#16294A; --st-deposit:#6EA8FF;
  --st-paid-bg:#15331F; --st-paid:#5BD088; --st-lost-bg:#262A35; --st-lost:#8C91A0; --st-special-bg:#2C1D4A; --st-special:#B48CFF; --st-refund-bg:#43191B; --st-refund:#FF7A74;
  --t-west:#FF9A4A; --t-west-bg:#3A2616; --t-miami:#FF72B6; --t-miami-bg:#3B1A2C; --t-east:#5DB4F5; --t-east-bg:#16293B; --t-nyc:#3FD1B7; --t-nyc-bg:#12302B; --t-dc:#9197FF; --t-dc-bg:#23244A; --t-westx:#FF8A5C; --t-westx-bg:#3E2019; --t-eastx:#8FB3FF; --t-eastx-bg:#1B2540; --t-niagara:#E8C85A; --t-niagara-bg:#352E12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#101219; --surface:#181B25; --surface-2:#1E2230; --fg:#E6E8EF; --muted:#9A9FB0; --line:#2A2F3E;
  --asphalt:#0B0D13; --asphalt-2:#171A24; --side-fg:#B9BDC9; --road:#FFC53D; --ink-btn:#E6E8EF; --ink-btn-fg:#12141B;
  --st-new-bg:transparent; --st-new:#8A90A0; --st-talk-bg:#3A3312; --st-talk:#F2CB47; --st-deposit-bg:#16294A; --st-deposit:#6EA8FF;
  --st-paid-bg:#15331F; --st-paid:#5BD088; --st-lost-bg:#262A35; --st-lost:#8C91A0; --st-special-bg:#2C1D4A; --st-special:#B48CFF; --st-refund-bg:#43191B; --st-refund:#FF7A74;
  --t-west:#FF9A4A; --t-west-bg:#3A2616; --t-miami:#FF72B6; --t-miami-bg:#3B1A2C; --t-east:#5DB4F5; --t-east-bg:#16293B; --t-nyc:#3FD1B7; --t-nyc-bg:#12302B; --t-dc:#9197FF; --t-dc-bg:#23244A; --t-westx:#FF8A5C; --t-westx-bg:#3E2019; --t-eastx:#8FB3FF; --t-eastx-bg:#1B2540; --t-niagara:#E8C85A; --t-niagara-bg:#352E12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--st-deposit);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* ---------- sidebar ---------- */
.side{position:fixed;inset:0 auto 0 0;width:248px;background:var(--asphalt);color:var(--side-fg);display:flex;flex-direction:column;z-index:40;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.brand{padding:22px 22px 18px}
.brand b{display:block;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.04em;color:#fff}
.brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8C91A1;margin-top:4px}
.road{height:3px;margin-top:14px;background:repeating-linear-gradient(90deg,var(--road) 0 14px,transparent 14px 24px);border-radius:2px;opacity:.9}
.nav{display:flex;flex-direction:column;gap:2px;padding:8px 12px;overflow-y:auto;flex:1}
.nav-label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#6F7486;padding:14px 10px 6px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--side-fg);padding:10px 12px;border-radius:12px;cursor:pointer;text-align:left;font-weight:500;letter-spacing:.01em}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button.on{background:rgba(255,255,255,.1);color:#fff}
.nav button.on svg{color:var(--road)}
.nav svg{width:19px;height:19px;flex:none}
.nav .badge{margin-left:auto;background:var(--road);color:#1B1E29;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
.side-foot{padding:14px 18px 18px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px;font-size:13px}
.ava{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--road);color:#1B1E29;flex:none}
.side-foot span{color:#fff;display:block;font-weight:600}
.side-foot small{color:#8C91A1}

/* ---------- main ---------- */
.main{margin-left:248px;min-height:100%;padding-inline:28px;padding-block:0 48px}
.top{display:flex;align-items:center;gap:14px;padding-block:22px 18px;flex-wrap:wrap}
.top h1{font-family:var(--f-display);font-weight:500;font-size:24px;margin:0;letter-spacing:.01em;text-wrap:balance}
.top .sp{flex:1}
.demo{font-size:12px;color:var(--muted);border:1px dashed var(--line);padding:4px 10px;border-radius:99px}
.menu-btn{display:none}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:12px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--ink-btn);color:var(--ink-btn-fg);border-color:transparent}
.btn.pri:hover{opacity:.9}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:10px}
.btn.ghost{background:transparent;border-color:transparent}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.panel h2{font-size:15px;margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:8px}
.panel h2 .cnt{font-weight:500;color:var(--muted);font-size:13px}
.hint{color:var(--muted);font-size:13px}
.empty{color:var(--muted);font-size:13.5px;padding:18px;text-align:center;border:1px dashed var(--line);border-radius:14px}
input.in,select.in,textarea.in{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0}
textarea.in{resize:vertical;min-height:80px}
label.fl{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;min-width:0}

/* ---------- home ---------- */
.hello{display:flex;flex-direction:column;gap:2px;margin-bottom:18px}
.hello p{margin:0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.stat:hover{border-color:var(--muted)}
.stat .v{font-family:var(--f-display);font-size:28px;font-weight:500;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.home-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.tour-line{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.tour-line:first-of-type{border-top:0}
.tour-line .ttl{font-weight:600}
.tour-line .meta{font-size:12.5px;color:var(--muted)}
.fillbar{height:6px;background:var(--surface-2);border-radius:9px;overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.fillbar i{display:block;height:100%;background:var(--st-paid)}
.q-item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.q-item:first-of-type{border-top:0}
.q-item .grow{flex:1;min-width:0}
.q-item .grow b{display:block;font-weight:600}
.q-item .grow small{color:var(--muted)}
.linkish{background:none;border:0;padding:0;cursor:pointer;color:inherit;text-align:left;font-weight:600}
.linkish:hover{text-decoration:underline}

/* ---------- pills ---------- */
.tpill{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 8px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--tb);color:var(--tc)}
.tpill i{width:8px;height:8px;border-radius:50%;background:var(--tc)}
.tpill em{font-style:normal;font-weight:500;opacity:.85}
.T-west{--tc:var(--t-west);--tb:var(--t-west-bg)} .T-miami{--tc:var(--t-miami);--tb:var(--t-miami-bg)} .T-east{--tc:var(--t-east);--tb:var(--t-east-bg)} .T-nyc{--tc:var(--t-nyc);--tb:var(--t-nyc-bg)} .T-dc{--tc:var(--t-dc);--tb:var(--t-dc-bg)} .T-westx{--tc:var(--t-westx);--tb:var(--t-westx-bg)} .T-eastx{--tc:var(--t-eastx);--tb:var(--t-eastx-bg)} .T-niagara{--tc:var(--t-niagara);--tb:var(--t-niagara-bg)}
.S-new{--sb:var(--st-new-bg);--sc:var(--st-new)} .S-talk{--sb:var(--st-talk-bg);--sc:var(--st-talk)} .S-deposit{--sb:var(--st-deposit-bg);--sc:var(--st-deposit)} .S-paid{--sb:var(--st-paid-bg);--sc:var(--st-paid)} .S-lost{--sb:var(--st-lost-bg);--sc:var(--st-lost)} .S-special{--sb:var(--st-special-bg);--sc:var(--st-special)} .S-refund{--sb:var(--st-refund-bg);--sc:var(--st-refund)}
.spill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--sc)}
.spill i{width:9px;height:9px;border-radius:50%;background:var(--sc);display:inline-block}
.S-new .spill i,.spill.S-new i{background:transparent;border:2px solid var(--sc)}

/* ---------- CRM ---------- */
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(4,minmax(0,1fr)) auto;gap:10px;align-items:end;margin-bottom:12px}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search-wrap input{padding-left:36px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--fg)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--sc)}
.chip.S-new i{background:transparent;border:2px solid var(--sc)}
.chip b{font-weight:500;color:var(--muted)}
.chip.on{background:var(--sb);border-color:var(--sc)}
.chip.S-new.on{background:var(--surface-2)}
.summary{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.summary b{color:var(--fg);font-weight:600}
.tbl-wrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table.rows{width:100%;border-collapse:separate;border-spacing:0 6px;min-width:1040px}
table.rows th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:4px 12px}
table.rows td{padding:12px;vertical-align:middle;background:var(--sb);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
table.rows tr.S-new td{background:var(--surface)}
table.rows td:first-child{border-left:1px solid var(--line);border-radius:14px 0 0 14px}
table.rows td:last-child{border-right:1px solid var(--line);border-radius:0 14px 14px 0}
table.rows tbody tr{cursor:pointer}
table.rows tbody tr:hover td{filter:brightness(.97)}
:root[data-theme="dark"] table.rows tbody tr:hover td{filter:brightness(1.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) table.rows tbody tr:hover td{filter:brightness(1.12)}}
.nm{font-weight:600}
.sub{font-size:12px;color:var(--muted)}
.order{font-family:var(--f-mono);font-weight:600;font-size:13px}
.pay{min-width:130px}
.pay .pv{font-weight:600;font-variant-numeric:tabular-nums}
.pay .pv span{color:var(--muted);font-weight:500}
.pbar{height:5px;border-radius:9px;background:color-mix(in srgb,var(--fg) 10%,transparent);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--st-paid);border-radius:9px}
.pay small{display:block;font-size:11.5px;color:var(--muted);margin-top:4px}
.pay small.due{color:var(--st-refund);font-weight:600}
.pay small.pend{color:var(--st-talk);font-weight:600}
select.stsel{appearance:none;-webkit-appearance:none;border:1px solid color-mix(in srgb,var(--sc) 45%,transparent);background:var(--surface);color:var(--sc);font-weight:600;font-size:12.5px;padding:6px 26px 6px 10px;border-radius:99px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 10px) 50%;background-size:4px 4px;background-repeat:no-repeat;max-width:200px}
.note-cell{max-width:210px;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.acts{font-size:12.5px}
.acts b{font-weight:600}
.ico-link{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:6px;background:color-mix(in srgb,var(--fg) 8%,transparent);font-size:11px;font-weight:700;margin-left:6px;vertical-align:1px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.38);z-index:50;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--bg);z-index:60;transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;border-left:1px solid var(--line);box-shadow:var(--shadow)}
.drawer.on{transform:none}
.dr-head{padding:calc(16px + env(safe-area-inset-top,0px)) 20px 14px;display:flex;flex-direction:column;gap:10px;background:var(--sb,var(--surface));border-bottom:1px solid var(--line)}
.dr-head.S-new{background:var(--surface)}
.dr-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dr-row .sp{flex:1}
.dr-name{font-size:22px;font-weight:700;margin:0;line-height:1.2}
.dr-body{overflow-y:auto;padding:16px 20px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.blk h3{margin:0 0 10px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tourblk{background:var(--tb);border-color:color-mix(in srgb,var(--tc) 35%,transparent)}
.tourblk h3{color:var(--tc)}
.tourblk .tn{font-weight:700;font-size:17px;color:var(--tc)}
.tourblk .td{font-weight:600;margin-top:2px}
.tourblk .tr{font-size:12.5px;color:var(--muted);margin-top:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13.5px}
.kv span{color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.kv .tot{border-top:1px solid var(--line);padding-top:6px}
.bigpay{display:flex;gap:10px;margin:12px 0 10px}
.bigpay div{flex:1;border-radius:12px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line)}
.bigpay small{display:block;font-size:11.5px;color:var(--muted)}
.bigpay b{font-size:18px;font-variant-numeric:tabular-nums}
.bigpay .ok b{color:var(--st-paid)} .bigpay .due b{color:var(--st-refund)}
.plist{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.pitem{display:flex;align-items:center;gap:10px;font-size:13px;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.pitem .grow{flex:1;min-width:0}
.pitem small{color:var(--muted)}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.ok{background:var(--st-paid-bg);color:var(--st-paid)} .tag.wait{background:var(--st-talk-bg);color:var(--st-talk)}
.row-form{display:flex;gap:8px;flex-wrap:wrap}
.row-form>*{flex:1 1 110px}
.row-form .btn{flex:0 0 auto}
.checks{display:grid;grid-template-columns:1fr;gap:6px}
.check{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);cursor:pointer;font-size:13.5px}
.check:hover{border-color:var(--muted)}
.check input{width:17px;height:17px;accent-color:var(--st-paid)}
.check .grow{flex:1}
.check b{font-variant-numeric:tabular-nums;font-weight:600}
.check.on{background:var(--st-paid-bg);border-color:color-mix(in srgb,var(--st-paid) 40%,transparent)}
.buddies{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.buddy{display:inline-flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);font-size:13px}
.buddy button.go{background:none;border:0;cursor:pointer;font-weight:600;padding:0}
.buddy button.go:hover{text-decoration:underline}
.buddy .x{border:0;background:transparent;cursor:pointer;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.buddy .x:hover{background:var(--line)}
.notes{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.nt{padding:9px 12px;border-radius:12px;background:var(--surface-2);font-size:13.5px}
.nt small{display:block;color:var(--muted);font-size:11.5px;margin-bottom:2px}
.task{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:6px 0}
.task input{width:17px;height:17px;accent-color:var(--st-paid)}
.task.done span{text-decoration:line-through;color:var(--muted)}
.meta-line{font-size:12.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.xbtn{border:0;background:rgba(0,0,0,.06);width:34px;height:34px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.xbtn:hover{background:rgba(0,0,0,.12)}
.xbtn svg{width:18px;height:18px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:70;padding:16px;pointer-events:none;opacity:0;transition:opacity .15s}
.modal.on{pointer-events:auto;opacity:1}
.modal .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;width:min(520px,100%);max-height:90vh;overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}

/* ---------- chat ---------- */
.chan-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chan{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:600;font-size:13px;cursor:pointer}
.chan.on{background:var(--ink-btn);color:var(--ink-btn-fg);border-color:transparent}
.chan:disabled{cursor:not-allowed;opacity:.55}
.chan small{font-weight:500;opacity:.8}
.chan svg{width:16px;height:16px}
.inbox{display:grid;grid-template-columns:300px minmax(0,1fr) 280px;height:calc(100vh - 190px);min-height:520px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.conv-list{border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
.conv{display:flex;gap:10px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%}
.conv:hover{background:var(--surface-2)}
.conv.on{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--tg)}
.conv .ava{background:var(--tg);color:#fff}
.conv .grow{flex:1;min-width:0}
.conv .top-l{display:flex;gap:6px;align-items:center}
.conv .top-l b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv .top-l small{margin-left:auto;color:var(--muted);font-size:11.5px;flex:none}
.conv p{margin:2px 0 0;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv .unread{background:var(--tg);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:0 7px;margin-left:6px;flex:none}
.thread{display:flex;flex-direction:column;min-width:0;min-height:0}
.th-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.th-head .grow{flex:1;min-width:0}
.th-head b{display:block}
.th-head small{color:var(--muted)}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.msg{max-width:78%;padding:9px 12px;border-radius:14px;font-size:13.5px;white-space:pre-wrap;word-wrap:break-word}
.msg small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.msg.client{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.bot{background:var(--surface);border:1px dashed var(--line);align-self:flex-end;border-bottom-right-radius:4px}
.msg.mgr{background:color-mix(in srgb,var(--tg) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--tg) 30%,transparent);align-self:flex-end;border-bottom-right-radius:4px}
.msg .who{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.composer{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.quick button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.quick button:hover{border-color:var(--muted)}
.comp-row{display:flex;gap:8px;align-items:flex-end}
.comp-row textarea{flex:1;min-height:42px;max-height:140px;resize:none}
.ctx{border-left:1px solid var(--line);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.ctx h3{margin:0;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mini{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--sb,var(--surface));display:flex;flex-direction:column;gap:8px}
.mini.S-new{background:var(--surface)}
.back-btn{display:none}

/* ---------- ambassadors ---------- */
.amb-top{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tier{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface-2)}
.tier b{display:block;font-family:var(--f-display);font-size:20px;font-weight:500}
.tier span{font-size:12.5px;color:var(--muted)}
.tier strong{display:block;margin-top:6px;font-size:13.5px}
.payout{display:flex;flex-direction:column;gap:6px}
.payout .v{font-family:var(--f-display);font-size:30px}
table.plain{width:100%;border-collapse:collapse;min-width:760px}
table.plain th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
table.plain td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.plain tr:last-child td{border-bottom:0}
.code{font-family:var(--f-mono);font-weight:600;background:var(--surface-2);border:1px solid var(--line);padding:2px 8px;border-radius:8px;font-size:12.5px}
.prog{display:flex;align-items:center;gap:8px;min-width:170px}
.prog .pbar{flex:1;margin:0}
.prog .pbar i{background:var(--road)}
.prog small{font-size:11.5px;color:var(--muted);white-space:nowrap}
.friends{font-size:12.5px;color:var(--muted);padding:0 10px 12px!important}
.friends .buddy{font-size:12px}

/* ---------- group chats ---------- */
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:13px;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .trk{width:40px;height:23px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.switch .trk::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+.trk{background:var(--st-paid)}
.switch input:checked+.trk::after{transform:translateX(17px)}
.switch input:focus-visible+.trk{outline:2px solid var(--st-deposit);outline-offset:2px}
.gc-group{margin-bottom:16px}
.gc-group>h2 .tpill{font-size:13px}
.gc-row{display:grid;grid-template-columns:150px 110px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.gc-row:first-of-type{border-top:0}
.gc-row .lnk{font-family:var(--f-mono);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.gc-row .lnk a{color:var(--fg)}
.gc-row .none{color:var(--st-refund);font-weight:600;font-size:12.5px}
.gc-acts{display:flex;gap:6px}
.lock{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:16px}
.lock svg{width:18px;height:18px;flex:none}

/* ---------- scripts & payments ---------- */
.scripts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.scard{display:flex;flex-direction:column;gap:8px}
.scard .cat{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.scard p{margin:0;white-space:pre-wrap;font-size:13.5px;flex:1}
.scard .row-form{justify-content:flex-end}
.doc{max-width:820px;display:flex;flex-direction:column;gap:12px}
.doc .panel p{margin:0;white-space:pre-wrap;line-height:1.6;max-width:68ch}
.doc .panel .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.doc .panel .hd h2{margin:0;flex:1}

/* ---------- lists ---------- */
.list-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.list-bar label.fl{flex:1 1 180px}
.list-bar .opts{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding-bottom:9px}
.opt{display:inline-flex;gap:7px;align-items:center;font-size:13px;cursor:pointer}
.opt input{width:16px;height:16px;accent-color:var(--st-deposit)}
.list-sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.list-sum div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:12.5px;color:var(--muted)}
.list-sum b{display:block;font-size:18px;color:var(--fg);font-variant-numeric:tabular-nums}
.list-sum .due b{color:var(--st-refund)}


/* v2 additions */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--surface-2);gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tour-line.past{opacity:.62}
.when{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.when.live{background:var(--road);color:#1B1E29;border-color:transparent}
.items{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:13px}
.item .iname{font-weight:600}
.item .isub{grid-column:1/2;font-size:12px;color:var(--muted)}
.item .itag{grid-row:1/3;grid-column:2;align-self:center}
.tag.none{background:var(--st-refund-bg);color:var(--st-refund)}
.autolog{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.autolog .nt{border:1px dashed var(--line);background:transparent}
.btn.danger{color:var(--st-refund);border-color:color-mix(in srgb,var(--st-refund) 40%,transparent)}
.btn.danger.armed{background:var(--st-refund);color:#fff;border-color:transparent}
input.gnote{width:100%;min-width:200px;border:1px solid transparent;background:var(--surface-2);border-radius:10px;padding:7px 10px;font-size:12.5px}
input.gnote:hover,input.gnote:focus{border-color:var(--line);background:var(--surface)}
.msg.bot.auto{border-style:solid;border-color:color-mix(in srgb,var(--st-paid) 45%,transparent);background:color-mix(in srgb,var(--st-paid) 10%,var(--surface))}

/* v3 additions */
.S-nocontact{--sb:var(--st-deposit-bg);--sc:var(--st-deposit)}
table.rows tr.S-nocontact td:first-child{box-shadow:inset 5px 0 0 var(--st-refund)}
.spill.S-nocontact i,.chip.S-nocontact i{box-shadow:0 0 0 2px var(--st-refund)}
.dr-head.S-nocontact{box-shadow:inset 5px 0 0 var(--st-refund)}
.wait{display:block;margin-top:5px;font-size:11.5px;font-weight:700;color:var(--st-refund);white-space:nowrap}
.wait.ok{color:var(--muted);font-weight:600}
.stat.alert{border-color:color-mix(in srgb,var(--st-refund) 50%,transparent);box-shadow:inset 0 3px 0 var(--st-refund)}
.auto-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:14px 0;border-top:1px solid var(--line);align-items:center}
.rule:first-of-type{border-top:0}
.rule .rt{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rule .rt small{font-weight:600;font-size:11px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:1px 8px;border-radius:99px}
.rule .flow{grid-column:1/2;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:12.5px;color:var(--muted)}
.rule .flow b{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.rule .flow span{color:var(--fg)}
.rule.off .rt,.rule.off .flow span{opacity:.5}
.rule .switch{grid-row:1/3;grid-column:2}
.log-item{display:grid;grid-template-columns:44px minmax(0,1fr);gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.log-item:first-of-type{border-top:0}
.log-item time{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:1px}
.log-item b{font-weight:600}
.log-item .lt{grid-column:2;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bolt{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:color-mix(in srgb,var(--road) 30%,transparent);color:var(--fg);flex:none}
.bolt svg{width:13px;height:13px}
.ex-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex-col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px}
.ex-col h4{margin:0 0 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cell-ex{font-size:12.5px;max-width:220px}
.due-red{color:var(--st-refund);font-weight:600}
.var{font-family:var(--f-mono);font-size:11.5px;background:color-mix(in srgb,var(--st-deposit) 12%,transparent);color:var(--st-deposit);border-radius:6px;padding:0 4px;white-space:nowrap}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .sp{flex:1}
.remind{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.remind span{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.remind span.sent{background:var(--st-paid-bg);color:var(--st-paid);border-color:transparent}
.tag.link{background:var(--st-deposit-bg);color:var(--st-deposit)}
.howto{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;max-width:880px}
.howto b{color:var(--fg)}
@media (max-width:900px){.auto-grid,.ex-cols{grid-template-columns:1fr}}
/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink-btn);color:var(--ink-btn-fg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13.5px;opacity:0;transition:.2s;z-index:90;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .filters{grid-template-columns:repeat(3,minmax(0,1fr))}
  .filters .search-wrap-l{grid-column:1/-1}
  .inbox{grid-template-columns:260px minmax(0,1fr)}
  .ctx{display:none}
}
@media (max-width:900px){
  .side{transform:translateX(-100%);transition:transform .2s}
  body.nav-open .side{transform:none;box-shadow:var(--shadow)}
  .main{margin-left:0;padding-inline:16px}
  .menu-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
  .menu-btn svg{width:18px;height:18px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .home-grid,.amb-top{grid-template-columns:1fr}
  .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gc-row{grid-template-columns:1fr auto;}
  .gc-row .lnk{grid-column:1/-1}
  .inbox{grid-template-columns:1fr;height:auto;min-height:0}
  .inbox .conv-list{max-height:none;border-right:0}
  .inbox.threaded .conv-list{display:none}
  .inbox:not(.threaded) .thread{display:none}
  .inbox .msgs{min-height:340px;max-height:55vh}
  .back-btn{display:inline-flex}
  .tiers{grid-template-columns:1fr}
  .top h1{font-size:20px}
}
@media (max-width:520px){
  .filters{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .bigpay{flex-direction:column}
  .demo{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<aside class="side" id="side">
  <div class="brand"><b>RIDE &amp; VIBE</b><small>Workspace · сезон 2026</small><div class="road"></div></div>
  <nav class="nav" id="nav"></nav>
  <div class="side-foot"><div class="ava">С</div><div><span>Софія</span><small>Підтримка</small></div></div>
</aside>
<div class="scrim" id="scrim"></div>

<main class="main">
  <div class="top">
    <button class="menu-btn" id="menuBtn" aria-label="Відкрити меню"></button>
    <h1 id="pageTitle">Головна</h1>

    <span class="demo">Демо-модель · тестові дані</span>
    <div id="topActions"></div>
  </div>
  <div id="view"></div>
</main>

<aside class="drawer" id="drawer" aria-label="Картка учасника"></aside>
<div class="modal" id="modal"><div class="card" id="modalCard"></div></div>
<div class="toast" id="toast"></div>

function listTable(sep){
 const q=v=>{v=String(v);return sep===','&&/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v.replace(/[\t\n]/g,' ')};
 const head=['№','Прізвище','Ім\'я','Телефон','Telegram','Email','Tour','Dates','Optional fun','Сплачено','Залишок','Статус','Нотатка для гідів'];
 const rows=listRows().map(p=>{const d=depOf(p.dep);return [p.order,p.last,p.first,p.phone,p.tg,p.email,TYPES[d.type].name,drange(d),p.addons.map(a=>ADD[a].name+(itemLeft(p,a)?' (unpaid)':'')).join('; '),paid(p),p.status==='lost'?0:left(p),STATUS[p.status],p.gnote]});
 return [head,...rows].map(r=>r.map(q).join(sep)).join('\n');
}

/* ================= render ================= */
function renderNav(){
 const unread=CONVS.reduce((s,x)=>s+x.unread,0);const nc=P.filter(p=>p.status==='nocontact').length;
 $('#nav').innerHTML='<div class="nav-label">Робочий простір</div>'+NAV.map(n=>`<button class="${S.view===n.id?'on':''}" data-act="nav" data-v="${n.id}">${ic(n.ic)}<span>${n.label}</span>${n.id==='chat'&&unread?`<span class="badge">${unread}</span>`:''}${n.id==='crm'&&nc?`<span class="badge" title="Не зв'язались">${nc}</span>`:''}</button>`).join('');
}
function render(){
 renderNav();
 $('#pageTitle').textContent=NAV.find(x=>x.id===S.view).ua;
 const sim=`<button class="btn" data-act="simDeposit">${ic('bolt')}${S.view==='auto'?'Simulate website deposit':'Симулювати оплату завдатку на сайті'}</button>`;
 $('#topActions').innerHTML=S.view==='crm'?`<div class="row-form">${sim}<button class="btn pri" data-act="new">${ic('plus')}Нове бронювання</button></div>`:(S.view==='home'||S.view==='auto')?sim:'';
 $('#view').innerHTML=V[S.view]();
 if(S.view==='crm')renderRows();
 if(S.view==='lists')renderList();
 if(S.view==='chat'){const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight}
}
function refresh(){
 const y=window.scrollY;const dy=$('.dr-body')?$('.dr-body').scrollTop:0;
 if(S.view==='crm'){renderRows();renderNav()}else if(S.view==='lists'){renderList();renderNav()}else render();
 renderDrawer();window.scrollTo(0,y);const b=$('.dr-body');if(b)b.scrollTop=dy;
}
function go(v){S.view=v;document.body.classList.remove('nav-open');$('#scrim').classList.toggle('on',!!(S.open||S.openP));try{history.replaceState(null,'','#'+v)}catch(e){}render();window.scrollTo(0,0)}
const openPerson=id=>{S.openP=null;S.open=id;S.arm=null;renderDrawer();const b=$('.dr-body');if(b)b.scrollTop=0};
const openPartner=id=>{S.open=null;S.openP=id;renderDrawer();const b=$('.dr-body');if(b)b.scrollTop=0};

/* ================= events ================= */
document.addEventListener('click',e=>{
 const tr=e.target.closest('tr[data-open]');
 if(tr&&!e.target.closest('select,button,a,input')){openPerson(tr.dataset.open);return}
 const tp=e.target.closest('tr[data-openp]');
 if(tp&&!e.target.closest('select,button,a,input')){openPartner(tp.dataset.openp);return}
 if(e.target.id==='scrim'){S.open=null;S.openP=null;renderDrawer();document.body.classList.remove('nav-open');return}
 if(e.target.id==='modal'){$('#modal').classList.remove('on');return}
 const el=e.target.closest('[data-act]');
 if(!el||el.tagName==='SELECT'||el.tagName==='INPUT')return;
 const a=el.dataset.act,id=el.dataset.id,p=id?byId(id):null;
 if(a!=='delPay'&&S.arm){S.arm=null}
 switch(a){
  case 'nav': go(el.dataset.v);break;
  case 'goStatus': S.f={q:'',type:'',dep:'',source:'',status:el.dataset.s};go('crm');break;
  case 'scrollQueue': $('#queue').scrollIntoView({behavior:'smooth',block:'start'});break;
  case 'homeTours': S.homeTours=el.dataset.k;render();break;
  case 'openList': S.list.dep=el.dataset.dep;S.list.type=depOf(el.dataset.dep).type;go('lists');break;
  case 'open': openPerson(id);break;
  case 'openP': openPartner(id);break;
  case 'close': S.open=null;S.openP=null;renderDrawer();break;
  case 'clearF': S.f={q:'',type:'',dep:'',source:'',status:''};render();break;
  case 'chip': S.f.status=S.f.status===el.dataset.s?'':el.dataset.s;$('#fst').value=S.f.status;renderRows();break;
  case 'simDeposit':{const np=simDeposit();if(np&&S.view==='crm'){S.f={q:'',type:'',dep:'',source:'',status:''};render()}else refresh();break}
  case 'contacted': markContacted(p);toast(nm(p)+': позначено «зв\'язались». Статус: «'+STATUS[p.status]+'»');refresh();break;
  case 'confirmPay': confirmPayment(p,+el.dataset.k);refresh();break;
  case 'stripePaid': stripePaid(p,+el.dataset.k);refresh();break;
  case 'delPay':{const key=id+':'+el.dataset.k;if(S.arm===key){const x=p.payments.splice(+el.dataset.k,1)[0];S.arm=null;toast((x.link?'Stripe-посилання на ':'Оплату ')+money(x.amt)+(x.link?' скасовано':' видалено'))}else{S.arm=key;toast('Натисніть ще раз, щоб підтвердити')}refresh();break}
  case 'addPay':{const amt=parseFloat($('#payAmt').value),m=$('#payM').value,f=$('#payFor').value;if(!(amt>0)){toast('Вкажіть суму оплати');break}
   if(m==='stripe'){sendStripeLink(p,f,amt);toast('Stripe-посилання на '+money(amt)+' надіслано учаснику в Telegram')}
   else if(m==='zelle'){const dup=p.payments.some(x=>!x.ok&&!x.link&&x.for===f&&x.amt===amt);p.payments.push({amt,method:'Zelle',ok:false,date:TODAY_S,by:S.me,for:f});toast(dup?'Увага: така сама оплата вже чекає підтвердження. Якщо це помилка, видаліть зайву.':'Оплату Zelle відправлено на перевірку фінансовій команді')}
   else{p.payments.push({amt,method:'Готівка',ok:true,date:TODAY_S,by:S.me,conf:S.me,for:f});const r=afterConfirm(p,p.payments[p.payments.length-1]);toast('Оплату готівкою додано'+(r.st?'. '+r.st:''))}
   refresh();break}
  case 'addBuddy':{const b=byId($('#buddySel').value);if(!b){toast('Оберіть учасника');break}p.buddies.push(b.id);b.buddies.push(p.id);refresh();break}
  case 'unbuddy':{const b=byId(el.dataset.b);p.buddies=p.buddies.filter(x=>x!==b.id);b.buddies=b.buddies.filter(x=>x!==p.id);refresh();break}
  case 'addNote':{const t=$('#noteIn').value.trim();if(!t)break;p.notes.push({by:S.me,text:t,date:TODAY_S});refresh();break}
  case 'addTask':{const t=$('#taskIn').value.trim();if(!t)break;p.tasks.push({text:t,done:false});refresh();break}
  case 'new': openNew();break;
  case 'mClose': $('#modal').classList.remove('on');break;
  case 'mCreate':{const f=$('#nF').value.trim(),l=$('#nL').value.trim();if(!f){toast('Вкажіть ім\'я');break}
   const max=Math.max(...P.map(x=>+x.order.slice(3)));
   const np=mkPerson(f,l,$('#nD').value,{status:'new',created:TODAY_S,source:$('#nS').value,order:'RV-'+(max+1)});
   np.phone=$('#nP').value.trim()||'—';np.tg=$('#nT').value.trim()||'—';np.email='—';
   P.push(np);if(S.pendingConv){const c=CONVS.find(x=>x.id===S.pendingConv);c.pid=np.id;c.name=nm(np)}
   $('#modal').classList.remove('on');toast('Створено '+np.order+', менеджер '+np.assignee);S.open=np.id;refresh();break}
  case 'conv':{const c=CONVS.find(x=>x.id===id);c.unread=0;S.chat.active=id;S.chat.threaded=true;render();break}
  case 'backConv': S.chat.threaded=false;render();break;
  case 'quick':{const c=CONVS.find(x=>x.id===S.chat.active);const pp=c&&c.pid?byId(c.pid):null;const t=$('#msgIn');t.value=fillVars(SCRIPT(el.dataset.sid).text,pp);t.focus();break}
  case 'send':{const t=$('#msgIn').value.trim();if(!t)break;const c=CONVS.find(x=>x.id===S.chat.active);c.msgs.push({from:'mgr',by:S.me,text:t,t:nowT()});c.time='Щойно';
   const pp=c.pid?byId(c.pid):null;let extraMsg='';if(pp&&pp.status==='nocontact'&&ON.contacted){markContacted(pp,'chat');extraMsg='Статус «не зв\'язались» змінено автоматично.'}
   render();$('#msgIn').focus();if(extraMsg)toast(extraMsg);break}
  case 'simulate':{const c=CONVS.find(x=>!x.pid)||CONVS[1];c.msgs.push({from:'client',text:pick(['Ще одне питання: чи є знижка, якщо їдемо вдвох?','Чи можна оплатити решту двома частинами?','What time is the meeting point on day 1?']),t:nowT()});c.unread++;c.time='Щойно';CONVS.splice(CONVS.indexOf(c),1);CONVS.unshift(c);render();toast('Нове повідомлення в Telegram від '+c.name);break}
  case 'leadFromChat':{const c=CONVS.find(x=>x.id===S.chat.active);const [f,...l]=c.name.split(' ');openNew({first:f,last:l.join(' '),tg:c.handle,source:'Telegram',conv:c.id});break}
  case 'toggleFr':{const r=document.querySelector(`tr[data-fr="${id}"]`);r.hidden=!r.hidden;break}
  case 'payout':{const r=ambData().find(x=>x.a.id===id);p.paidOut=r.earned;toast('Виплату '+money(r.due)+' для '+nm(p)+' позначено');render();break}
  case 'copy': copyText(el.dataset.t,'Скопійовано');break;
  case 'gcEdit': S.gcEdit=id;render();setTimeout(()=>{const i=$('#gcIn');if(i)i.focus()},30);break;
  case 'gcCancel': S.gcEdit=null;render();break;
  case 'gcSave':{depOf(id).chat=$('#gcIn').value.trim();S.gcEdit=null;toast('Посилання збережено');render();break}
  case 'xAdd':{const n=$('#xName').value.trim(),u=$('#xUrl').value.trim();if(!n||!u){toast('Вкажіть назву і посилання');break}S.extraChats.push({id:'x'+Date.now(),name:n,url:u});render();break}
  case 'xDel': S.extraChats=S.extraChats.filter(x=>x.id!==id);render();break;
  case 'scCat': S.scCat=el.dataset.c;render();break;
  case 'scNew': S.scriptEdit='new';render();break;
  case 'scEdit': S.scriptEdit=id;render();window.scrollTo(0,0);break;
  case 'scCancel': S.scriptEdit=null;render();break;
  case 'scSave':{const t=$('#scT').value.trim(),x=$('#scX').value.trim();if(!t||!x){toast('Add a title and text');break}
   const obj={title:t,cat:$('#scC').value.trim()||'Other',text:x,quick:$('#scQ2').checked};
   if(S.scriptEdit==='new')SCRIPTS.unshift(Object.assign({id:'s'+Date.now()},obj));else Object.assign(SCRIPT(S.scriptEdit),obj);
   S.scriptEdit=null;toast('Script saved');render();break}
  case 'scDel':{const i=SCRIPTS.findIndex(s=>s.id===id);if(i>-1)SCRIPTS.splice(i,1);render();break}
  case 'pdEdit': S.paydocEdit=+el.dataset.k;render();break;
  case 'pdCancel': S.paydocEdit=null;render();break;
  case 'pdSave':{const k=+el.dataset.k;S.paydocs[k]={h:$('#pdH').value.trim()||'Untitled',t:$('#pdT').value.trim()};S.paydocEdit=null;toast('Saved');render();break}
  case 'pdDel': S.paydocs.splice(+el.dataset.k,1);S.paydocEdit=null;render();break;
  case 'pdAdd': S.paydocs.push({h:'New section',t:''});S.paydocEdit=S.paydocs.length-1;render();break;
  case 'copyList': copyText(listTable('\t'),'Таблицю скопійовано. Вставте її в Excel або Google Sheets',true);break;
  case 'dlList': downloadCSV();break;
  case 'pStageF': S.pStage=S.pStage===el.dataset.s?'':el.dataset.s;render();break;
  case 'newP': openNewPartner();break;
  case 'npCreate':{const n=$('#npN').value.trim();if(!n){toast('Add a name');break}
   const x={id:'pt'+Date.now(),name:n,type:$('#npT').value,city:$('#npC').value.trim()||'—',contact:$('#npK').value.trim()||'—',owner:$('#npO').value,stage:$('#npS').value,since:TODAY_S,code:'',
    give:$('#npG').value.trim()||'—',get:$('#npW').value.trim()||'—',deliv:[],next:{text:'First call',date:addDays(TODAY_S,3)},notes:[]};
   PARTNERS.unshift(x);$('#modal').classList.remove('on');toast(n+' added');render();openPartner(x.id);break}
  case 'pdAddItem':{const x=byP(S.openP);const sd=el.dataset.side;const t=$('#pdIn-'+sd).value.trim();if(!t)break;x.deliv.push({side:sd,text:t,done:false});refresh();break}
  case 'pNext':{const x=byP(S.openP);const t=$('#nsText').value.trim(),d=$('#nsDate').value;if(!t||!d){toast('Add the step and a date');break}x.next={text:t,date:d};toast('Next step set for '+fd(d));refresh();break}
  case 'pNote':{const x=byP(S.openP);const t=$('#pNoteIn').value.trim();if(!t)break;x.notes.push({by:S.me,text:t,date:TODAY_S});refresh();break}
  case 'pSetCode':{const x=byP(S.openP);const c=$('#pCode').value.trim().toUpperCase().replace(/\s+/g,'');if(!c){toast('Type a code');break}x.code=c;toast('Code '+c+' created. Bookings with it will be counted automatically.');refresh();break}
 }
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.rule){ON[t.dataset.rule]=t.checked;toast(RULE[t.dataset.rule].title+(t.checked?': on':': off. This step is now manual.'));render();return}
 if(t.dataset.pdel!==undefined){const x=byP(S.openP);x.deliv[+t.dataset.pdel].done=t.checked;refresh();return}
 if(t.dataset.gnote){byId(t.dataset.gnote).gnote=t.value.trim();toast('Нотатку для гідів збережено');if(S.open)renderDrawer();return}
 if(t.dataset.act==='rowStatus'||t.dataset.act==='drStatus'){const p=byId(t.dataset.id);p.status=t.value;if(t.value!=='nocontact')p.hrs=null;else if(p.hrs==null)p.hrs=0;refresh();return}
 if(t.dataset.act==='pStage'){byP(t.dataset.id).stage=t.value;refresh();return}
 if(t.dataset.act==='chMgr'){byId(t.dataset.id).assignee=t.value;toast('Менеджер: '+t.value);refresh();return}
 if(t.dataset.act==='addon'){const p=byId(t.dataset.id);const a=t.dataset.a;
  if(!t.checked&&p.payments.some(x=>x.for===a&&x.ok)){t.checked=true;toast('За цю активність вже є оплата. Спершу оформіть повернення.');return}
  if(t.checked){p.addons.push(a);if(ON.addonLink){sendStripeLink(p,a,ADD[a].price,true);logA('addonLink',`Stripe link for ${ADD[a].name} (${money(ADD[a].price)}) sent to ${nm(p)}`,p.id);toast(ADD[a].name+' додано. Stripe-посилання на '+money(ADD[a].price)+' надіслано автоматично.')}else toast(ADD[a].name+' додано. Надішліть посилання на оплату вручну.')}
  else{p.addons=p.addons.filter(x=>x!==a);p.payments=p.payments.filter(x=>!(x.for===a&&!x.ok))}
  refresh();return}
 if(t.dataset.act==='task'){byId(t.dataset.id).tasks[+t.dataset.k].done=t.checked;refresh();return}
 if(t.dataset.act==='chDep'){const p=byId(t.dataset.id);p.dep=t.value;const ty=typeOf(p);const drop=p.addons.filter(a=>!ADD[a].types.includes(ty));p.addons=p.addons.filter(a=>ADD[a].types.includes(ty));p.payments=p.payments.filter(x=>!(drop.includes(x.for)&&!x.ok));p.payments.forEach(x=>{if(drop.includes(x.for))x.for='tour'});toast(nm(p)+': '+TYPES[ty].name+', '+drange(depOf(p.dep)));refresh();return}
 switch(t.id){
  case 'payFor':{const p=byId(S.open);const f=t.value;const v=itemLeft(p,f)-itemPend(p,f);$('#payAmt').value=v>0?v:'';break}
  case 'ftype': S.f.type=t.value;S.f.dep='';$('#depWrap').hidden=!t.value;$('#fdep').innerHTML=depOptions(t.value,'');renderRows();break;
  case 'fdep': S.f.dep=t.value;renderRows();break;
  case 'fsrc': S.f.source=t.value;renderRows();break;
  case 'fst': S.f.status=t.value;renderRows();break;
  case 'ltype': S.list.type=t.value;S.list.dep='';render();break;
  case 'ldep': S.list.dep=t.value;renderList();break;
  case 'ldebt': S.list.debt=t.checked;renderList();break;
  case 'llost': S.list.lost=t.checked;renderList();break;
  case 'adminSw': S.admin=t.checked;S.gcEdit=null;render();break;
  case 'gcPast': S.gcPast=t.checked;render();break;
  case 'pTypeF': S.pType=t.value;render();break;
  case 'assignee': CONVS.find(x=>x.id===S.chat.active).assignee=t.value;toast('Чат передано: '+t.value);break;
 }
});
document.addEventListener('input',e=>{
 if(e.target.id==='fq'){S.f.q=e.target.value;renderRows()}
 if(e.target.id==='scSearch'){S.scQ=e.target.value;const pos=e.target.selectionStart;render();const i=$('#scSearch');if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(err){}}}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if($('#modal').classList.contains('on'))$('#modal').classList.remove('on');else if(S.open||S.openP){S.open=null;S.openP=null;renderDrawer()}}
 if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='msgIn'){e.preventDefault();$('[data-act="send"]').click()}
 if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.gnote){e.target.blur()}
});
$('#menuBtn').innerHTML=ic('menu');
$('#menuBtn').addEventListener('click',()=>{document.body.classList.toggle('nav-open');$('#scrim').classList.toggle('on',document.body.classList.contains('nav-open'))});

function copyText(t,msg,big){
 const fall=()=>{if(big)openText('Скопіюйте таблицю',t);else toast('Не вдалося скопіювати автоматично')};
 try{navigator.clipboard.writeText(t).then(()=>toast(msg),fall)}catch(err){fall()}
}
let DL=null;
try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(n=>{DL=n}).catch(()=>{})}catch(e){}
function downloadCSV(){
 const L=S.list;const name='ride-vibe_'+(L.dep||L.type||'all')+'.csv';
 if(!DL){try{const b=new Blob(['\uFEFF'+listTable(',')],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Файл '+name+' збережено')}catch(e){toast('Не вдалося зберегти файл. Скористайтесь «Копіювати для Excel»')}return}
 DL.save({filename:name,data:'﻿'+listTable(',')}).then(()=>toast('Файл '+name+' збережено')).catch(err=>{if(err&&err.code==='declined')return;toast('Не вдалося зберегти файл. Скористайтесь «Копіювати для Excel»')});
}

/* ================= boot ================= */
(function(){const h=(location.hash||'').slice(1);if(NAV.some(n=>n.id===h))S.view=h;render()})();

</script>
